
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pinch Pop</title>

  <style>
    :root {
      color-scheme: dark;
      background: #100d20;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: radial-gradient(ellipse at 50% 45%, #21183c 0%, #100d20 72%);
    }

    #scene-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      touch-action: none;
    }

    @media (max-width: 600px) {
      #scene-container {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div id="scene-container"></div>

  <script type="module" src="/src/index.ts"></script>
</body>
</html>
